        body {

        }

        * {
            font-family: 'Vazirmatn', sans-serif;
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .task-item {
            transition: all 0.3s ease;
        }

        .task-item:hover {
            transform: translateX(-4px);
        }

        .completed-task {
            opacity: 0.6;
        }

        .week-tab {
            transition: all 0.2s ease;
        }

        .week-tab:hover {
            transform: translateY(-2px);
        }

        .notification-badge {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
    <style>
        @view-transition {
            navigation: auto;
        }
    </style>

        let currentWeek = 1;
        let allTasks = [];
        let notificationPermission = false;

        async function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                const permission = await Notification.requestPermission();
                notificationPermission = permission === 'granted';
                return notificationPermission;
            }
            notificationPermission = Notification.permission === 'granted';
            return notificationPermission;
        }

        function showNotification(title, body) {
            if (notificationPermission && 'Notification' in window) {
                new Notification(title, {
                    body: body,
                    icon: '🎯',
                    badge: '✅'
                });
            }
        }

        function loadTasksFromStorage() {
            const saved = localStorage.getItem('weeklyTasks');
            if (saved) {
                try {
                    allTasks = JSON.parse(saved);
                } catch (e) {
                    allTasks = [];
                }
            } else {
                allTasks = [];
            }
            renderApp();
        }

        function saveTasksToStorage() {
            localStorage.setItem('weeklyTasks', JSON.stringify(allTasks));
        }

        async function initializeApp() {
            loadTasksFromStorage();
            await requestNotificationPermission();
        }

        function generateTaskId(weekNum, dayIndex, taskIndex) {
            return `week${weekNum}_day${dayIndex}_task${taskIndex}`;
        }

        function toggleTask(taskId, weekNum, dayIndex, taskIndex) {
            const existingTaskIndex = allTasks.findIndex(t => t.task_id === taskId);
            const task = weeklySchedule[weekNum - 1].days[dayIndex].tasks[taskIndex];
            const dayName = weeklySchedule[weekNum - 1].days[dayIndex].day;

            if (existingTaskIndex !== -1) {
                // تسک موجود است، وضعیت آن را تغییر می‌دهیم
                allTasks[existingTaskIndex].completed = !allTasks[existingTaskIndex].completed;
                allTasks[existingTaskIndex].completion_date = allTasks[existingTaskIndex].completed ?
                    new Date().toISOString() : "";

                if (allTasks[existingTaskIndex].completed) {
                    showNotification('تبریک! ✅', `"${task.activity}" انجام شد`);
                }
            } else {
                // تسک جدید است
                const newTask = {
                    task_id: taskId,
                    week_number: weekNum,
                    day: dayName,
                    activity: task.activity,
                    time_range: task.time,
                    completed: true,
                    completion_date: new Date().toISOString()
                };

                allTasks.push(newTask);
                showNotification('تبریک! ✅', `"${task.activity}" انجام شد`);
            }

            saveTasksToStorage();
            renderApp();
        }

        function showInlineMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg z-50';
            messageDiv.style.backgroundColor = window.elementSdk?.config?.primary_action_color || defaultConfig.primary_action_color;
            messageDiv.style.color = '#ffffff';
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        function calculateProgress(weekNum) {
            const weekData = weeklySchedule[weekNum - 1];
            let totalTasks = 0;
            let completedTasks = 0;

            weekData.days.forEach((day, dayIndex) => {
                day.tasks.forEach((task, taskIndex) => {
                    totalTasks++;
                    const taskId = generateTaskId(weekNum, dayIndex, taskIndex);
                    const savedTask = allTasks.find(t => t.task_id === taskId);
                    if (savedTask && savedTask.completed) {
                        completedTasks++;
                    }
                });
            });

            return totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
        }

        function isTaskCompleted(weekNum, dayIndex, taskIndex) {
            const taskId = generateTaskId(weekNum, dayIndex, taskIndex);
            const savedTask = allTasks.find(t => t.task_id === taskId);
            return savedTask && savedTask.completed;
        }

            </h1>
            <p class="mb-6" style="font-size: ${baseSize}px; color: ${config.text_color || defaultConfig.text_color}; opacity: 0.8;">
              🧠 ${config.goal_text || defaultConfig.goal_text}
            </p>
            
            ${notificationPermission ?
                    `<div class="inline-flex items-center gap-2 px-4 py-2 rounded-full" style="background-color: ${config.secondary_action_color || defaultConfig.secondary_action_color}; opacity: 0.2;">
                <span class="notification-badge" style="font-size: ${baseSize * 0.85}px; color: ${config.text_color || defaultConfig.text_color};">🔔 اعلان‌ها فعال</span>
              </div>` :
                    `<button onclick="enableNotifications()" class="px-4 py-2 rounded-full" style="background-color: ${config.primary_action_color || defaultConfig.primary_action_color}; color: #ffffff; font-size: ${baseSize * 0.85}px;">
                🔔 فعال‌سازی اعلان‌ها
              </button>`
                }
          </div>

          <!-- Week Tabs -->
          <div class="flex gap-3 mb-6 overflow-x-auto pb-2">
            ${weeklySchedule.map((week, index) => {
                    const weekProgress = calculateProgress(week.week);
                    const isActive = currentWeek === week.week;
                    return `
                <button 
                  onclick="changeWeek(${week.week})"
                  class="week-tab flex-shrink-0 px-6 py-3 rounded-xl shadow-md"
                  style="background-color: ${isActive ? (config.primary_action_color || defaultConfig.primary_action_color) : (config.card_color || defaultConfig.card_color)}; 
                         color: ${isActive ? '#ffffff' : (config.text_color || defaultConfig.text_color)}; 
                         font-size: ${baseSize * 0.9}px;
                         font-weight: ${isActive ? '600' : '500'};">
                  <div>${week.title.split('(')[0]}</div>
                  <div class="text-sm mt-1" style="opacity: 0.9;">${weekProgress}٪ انجام شده</div>
                </button>
              `;
                }).join('')}
          </div>

            <div class="flex items-center justify-between">

                <svg class="progress-ring" width="120" height="120">
                  <circle cx="60" cy="60" r="54" fill="none" stroke="${config.secondary_action_color || defaultConfig.secondary_action_color}" stroke-width="8" opacity="0.2"/>
                  <circle cx="60" cy="60" r="54" fill="none" stroke="${config.primary_action_color || defaultConfig.primary_action_color}" stroke-width="8" 
                    stroke-dasharray="${2 * Math.PI * 54}" 
                    stroke-dashoffset="${2 * Math.PI * 54 * (1 - progress / 100)}"
                    stroke-linecap="round"
                    style="transition: stroke-dashoffset 0.5s ease;"/>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                  <span style="font-size: ${baseSize * 1.5}px; color: ${config.primary_action_color || defaultConfig.primary_action_color}; font-weight: 700;">
                    ${progress}٪
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- Days and Tasks List -->
          <div class="space-y-6">
            ${currentWeekData.days.map((day, dayIndex) => {
                    const dayProgress = day.tasks.filter((task, taskIndex) =>
                        isTaskCompleted(currentWeek, dayIndex, taskIndex)
                    ).length;
                    const dayTotal = day.tasks.length;
                    const dayPercentage = dayTotal > 0 ? Math.round((dayProgress / dayTotal) * 100) : 0;

                    return `
                <div class="p-5 rounded-xl shadow-lg" style="background-color: ${config.card_color || defaultConfig.card_color};">
                  <!-- Day Header -->
                  <div class="flex items-center justify-between mb-4 pb-3 border-b" style="border-color: ${config.secondary_action_color || defaultConfig.secondary_action_color}; opacity: 0.2;">
                    <div>
                      <h3 style="font-size: ${baseSize * 1.3}px; color: ${config.text_color || defaultConfig.text_color}; font-weight: 600;">
                        ${day.day}
                      </h3>
                      <p style="font-size: ${baseSize * 0.9}px; color: ${config.text_color || defaultConfig.text_color}; opacity: 0.7;">
                        ${day.date}
                      </p>
                    </div>
                    <div class="text-left">
                      <div style="font-size: ${baseSize * 1.1}px; color: ${config.primary_action_color || defaultConfig.primary_action_color}; font-weight: 600;">
                        ${dayPercentage}٪
                      </div>
                      <div style="font-size: ${baseSize * 0.8}px; color: ${config.text_color || defaultConfig.text_color}; opacity: 0.6;">
                        ${dayProgress}/${dayTotal} تسک
                      </div>
                    </div>
                  </div>
                  
                  <!-- Day Tasks -->
                  <div class="space-y-3">
                    ${day.tasks.map((task, taskIndex) => {
                        const taskId = generateTaskId(currentWeek, dayIndex, taskIndex);
                        const completed = isTaskCompleted(currentWeek, dayIndex, taskIndex);

                        return `
                        <div class="task-item p-4 rounded-lg ${completed ? 'completed-task' : ''}" 
                             style="background-color: ${config.background_color || defaultConfig.background_color}; opacity: 0.7;">
                          <div class="flex items-start gap-4">
                            <button 
                              onclick="toggleTask('${taskId}', ${currentWeek}, ${dayIndex}, ${taskIndex})"
                              class="flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center mt-1"
                              style="border-color: ${config.primary_action_color || defaultConfig.primary_action_color}; 
                                     background-color: ${completed ? (config.primary_action_color || defaultConfig.primary_action_color) : 'transparent'};">
                              ${completed ? '<span style="color: #ffffff; font-size: 14px;">✓</span>' : ''}
                            </button>
                            
                            <div class="flex-1">
                              <div class="flex items-start justify-between gap-4 mb-2">
                                <h4 style="font-size: ${baseSize * 1.05}px; color: ${config.text_color || defaultConfig.text_color}; font-weight: 500; ${completed ? 'text-decoration: line-through; opacity: 0.6;' : ''}">
                                  ${task.activity}
                                </h4>
                                <span class="flex-shrink-0 px-3 py-1 rounded-full text-sm" 
                                      style="background-color: ${config.primary_action_color || defaultConfig.primary_action_color}; 
                                             color: #ffffff; 
                                             opacity: 0.8;
                                             font-size: ${baseSize * 0.75}px;">
                                  ${task.time}
                                </span>
                              </div>
                              
                              <p style="font-size: ${baseSize * 0.85}px; color: ${config.text_color || defaultConfig.text_color}; opacity: 0.7;">
                                ${task.description}
                              </p>
                            </div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
                }).join('')}
          </div>

          <!-- Overall Progress -->
          <div class="mt-8 p-6 rounded-2xl shadow-lg" style="background-color: ${config.card_color || defaultConfig.card_color};">
            <h3 class="mb-4" style="font-size: ${baseSize * 1.2}px; color: ${config.text_color || defaultConfig.text_color}; font-weight: 600;">
              📊 پیشرفت کلی سه هفته
            </h3>
            <div class="space-y-3">
              ${weeklySchedule.map(week => {
                    const weekProgress = calculateProgress(week.week);
                    return `
                  <div>
                    <div class="flex justify-between mb-1">
                      <span style="font-size: ${baseSize * 0.9}px; color: ${config.text_color || defaultConfig.text_color};">
                        ${week.title.split('(')[0]}
                      </span>
                      <span style="font-size: ${baseSize * 0.9}px; color: ${config.primary_action_color || defaultConfig.primary_action_color}; font-weight: 600;">
                        ${weekProgress}٪
                      </span>
                    </div>
                    <div class="w-full h-2 rounded-full" style="background-color: ${config.secondary_action_color || defaultConfig.secondary_action_color}; opacity: 0.2;">
                      <div class="h-full rounded-full transition-all duration-500" 
                           style="width: ${weekProgress}%; background-color: ${config.primary_action_color || defaultConfig.primary_action_color};"></div>
                    </div>
                  </div>
                `;
                }).join('')}
            </div>
          </div>
        </div>
      `;
        }

        window.changeWeek = function (weekNum) {
            currentWeek = weekNum;
            renderApp();
        };

        window.toggleTask = toggleTask;

        window.enableNotifications = async function () {
            const granted = await requestNotificationPermission();
            if (granted) {
                showNotification('اعلان‌ها فعال شد! 🎉', 'از این به بعد برای هر تسک انجام شده اعلان دریافت می‌کنید');
            }
            renderApp();
        };

        async function onConfigChange(config) {
            renderApp();
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities: (config) => ({
                    recolorables: [
                        {
                            get: () => config.background_color || defaultConfig.background_color,
                            set: (value) => {
                                config.background_color = value;
                                window.elementSdk.setConfig({ background_color: value });
                            }
                        },
                        {
                            get: () => config.card_color || defaultConfig.card_color,
                            set: (value) => {
                                config.card_color = value;
                                window.elementSdk.setConfig({ card_color: value });
                            }
                        },
                        {
                            get: () => config.text_color || defaultConfig.text_color,
                            set: (value) => {
                                config.text_color = value;
                                window.elementSdk.setConfig({ text_color: value });
                            }
                        },
                        {
                            get: () => config.primary_action_color || defaultConfig.primary_action_color,
                            set: (value) => {
                                config.primary_action_color = value;
                                window.elementSdk.setConfig({ primary_action_color: value });
                            }
                        },
                        {
                            get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                            set: (value) => {
                                config.secondary_action_color = value;
                                window.elementSdk.setConfig({ secondary_action_color: value });
                            }
                        }
                    ],
                    borderables: [],
                    fontEditable: {
                        get: () => config.font_family || defaultConfig.font_family,
                        set: (value) => {
                            config.font_family = value;
                            window.elementSdk.setConfig({ font_family: value });
                        }
                    },
                    fontSizeable: {
                        get: () => config.font_size || defaultConfig.font_size,
                        set: (value) => {
                            config.font_size = value;
                            window.elementSdk.setConfig({ font_size: value });
                        }
                    }
                }),
                mapToEditPanelValues: (config) => new Map([
                    ["app_title", config.app_title || defaultConfig.app_title],
                    ["goal_text", config.goal_text || defaultConfig.goal_text]
                ])
            });
        }

        initializeApp();
    </script>
